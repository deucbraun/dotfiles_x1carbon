
# MesloLGS NF ist speziell für Powerlevel10k empfohlen
font_family      MesloLGS Nerd Font Mono
bold_font        MesloLGS Nerd Font Mono Bold
italic_font      MesloLGS Nerd Font Mono Italic
bold_italic_font MesloLGS Nerd Font Mono Bold Italic
font_size        11.0

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Window-Layout
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no

# Tab-Bar
tab_bar_edge bottom
tab_bar_style powerline

# Tokyo Night Theme
foreground #c0caf5
background #1a1b26

color0 #15161E
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
