# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # Vermeidet mehrfache hyprlock-Instanzen
    before_sleep_cmd = loginctl lock-session    # Lock vor Suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Display nach Aufwachen aktivieren
}

# Bildschirm dimmen nach 5 Minuten
listener {
    timeout = 300                               # 5 min
    on-timeout = brightnessctl -s set 10%       # auf 10% dimmen (mit %)
    on-resume = brightnessctl -r                # Helligkeit wiederherstellen
}

# Lock nach 10 Minuten
listener {
    timeout = 600                               # 10 min
    on-timeout = loginctl lock-session          # Bildschirm sperren
}

# Display aus nach 15 Minuten  
listener {
    timeout = 900                               # 15 min
    on-timeout = hyprctl dispatch dpms off      # Display aus
    on-resume = hyprctl dispatch dpms on        # Display an bei Aktivität
}

# Suspend nach 30 Minuten (nur auf Akku)
listener {
    timeout = 1800                              # 30 min
    on-timeout = [[ $(cat /sys/class/power_supply/ADP*/online) == "0" ]] && systemctl suspend
}
