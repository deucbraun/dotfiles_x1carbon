# #######################################################################################
# HYPRLAND CONFIG - MODULAR STRUCTURE
# Configuration split into maintainable parts
# #######################################################################################

# This is the main Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# Configuration is split into multiple files for better maintainability
# Each file handles a specific aspect of the configuration

# Monitor configuration
source = ~/.config/hypr/configs/monitors.conf

# Program definitions
source = ~/.config/hypr/configs/programs.conf

# Autostart applications
source = ~/.config/hypr/configs/autostart.conf

# Environment variables
source = ~/.config/hypr/configs/environment.conf

# Permissions (commented out by default)
source = ~/.config/hypr/configs/permissions.conf

# Look and feel (general, decoration, animations, misc)
source = ~/.config/hypr/configs/appearance.conf

# Layout configuration (dwindle, master, workspace rules)
source = ~/.config/hypr/configs/layouts.conf

# Input configuration (keyboard, mouse, touchpad, gestures)
source = ~/.config/hypr/configs/input.conf

# Keybindings
source = ~/.config/hypr/configs/keybinds.conf

# Window and workspace rules
source = ~/.config/hypr/configs/windowrules.conf