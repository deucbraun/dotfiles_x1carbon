##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Spezifische App-Regeln für bessere UX
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
#windowrule = float on, match:class ^(gsimplecal)$
#windowrule = float on, match:class ^(galculator)$

# Firefox PiP
#windowrule = float on, match:title ^(Picture-in-Picture)$
#windowrule = pin on, match:title ^(Picture-in-Picture)$

# Workspace Bind
windowrule = workspace 2, match:class ^(brave-browser)$
windowrule = workspace 3, match:class ^(Bitwarden)$
