#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# SICHERHEIT: Sofortiger Lock beim Start
exec-once = hyprlock
# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = dunst
exec-once = GDK_SCALE=1.25 nm-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprpaper
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/wallpaper-rotation.sh
exec-once = blueman-applet
exec-once = kitty
exec-once = claude-desktop --enable-features=UseOzonePlatform --ozone-platform=wayland --force-device-scale-factor=1.25
exec-once = brave --enable-features=UseOzonePlatform --ozone-platform=wayland --no-first-run
exec-once = bitwarden-desktop --enable-features=UseOzonePlatform --ozone-platform=wayland --force-device-scale-factor=1.25
exec-once = sleep 3 && hyprctl dispatch workspace 1
# Monitor-Management beim Start
exec-once = ~/.config/hypr/scripts/monitor-management.sh
# Event-Handler für Hot-Plug (An-/Abstecken während Betrieb)
exec-once = ~/.config/hypr/scripts/hyprland-monitor-events.sh
