# Hyprpaper Configuration for Automatic Rotation
# Place this file at: ~/.config/hypr/hyprpaper.conf

# Enable IPC for automatic rotation to work (1 = on, 0 = off)
ipc = 1

# Disable splash for cleaner transitions (1 = on, 0 = off)
splash = 0

# Splash offset percentage from bottom (INT only, e.g. 20 = 20%)
splash_offset = 20

# Initial wallpaper for your monitor (hyprpaper 0.8+ block syntax)
wallpaper {
    monitor = eDP-1
    path = ~/Bilder/Wallpapers/default.jpg
    fit_mode = cover
}
