# Hyprpaper Configuration for Automatic Rotation
# Place this file at: ~/.config/hypr/hyprpaper.conf

# Preload an initial wallpaper (the script will handle rotation)
preload = ~/Bilder/Wallpapers/default.jpg

# Set initial wallpaper for your monitor
wallpaper = eDP-1,~/Bilder/Wallpapers/default.jpg

# IMPORTANT: Enable IPC for automatic rotation to work
ipc = on

# Disable splash for cleaner transitions
splash = false

# Fractional scaling offset (optional, for better quality)
splash_offset = 2.0
